<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mergington High School Activities</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Mergington High School</h1>
      <h2>Extracurricular Activities</h2>
    </header>

    <main>
      <section id="auth-view" class="auth-panel">
        <div class="auth-tabs">
          <h3>Welcome</h3>
        </div>

        <form id="login-form" class="auth-form">
          <h4>Student Login</h4>
          <div class="form-group">
            <label for="login-email">Email:</label>
            <input type="email" id="login-email" required placeholder="student@mergington.edu" />
          </div>
          <div class="form-group">
            <label for="login-password">Password:</label>
            <input type="password" id="login-password" required placeholder="Enter your password" />
          </div>
          <button type="submit">Log In</button>
        </form>

        <form id="auth-signup-form" class="auth-form">
          <h4>Create Account</h4>
          <div class="form-group">
            <label for="signup-name">Full Name:</label>
            <input type="text" id="signup-name" required placeholder="Student Name" />
          </div>
          <div class="form-group">
            <label for="signup-email">Email:</label>
            <input type="email" id="signup-email" required placeholder="student@mergington.edu" />
          </div>
          <div class="form-group">
            <label for="signup-password">Password:</label>
            <input type="password" id="signup-password" required placeholder="Choose a password" />
          </div>
          <button type="submit">Create Account</button>
        </form>

        <div id="auth-message" class="message hidden"></div>
      </section>

      <section id="app-view" class="hidden">
        <div class="topbar">
          <h3>Available Activities</h3>
          <button id="logout-btn" class="secondary-button" type="button">Log Out</button>
        </div>
        <div id="activities-list">
          <p>Loading activities...</p>
        </div>

        <div id="signup-container">
          <h3>Sign Up for an Activity</h3>
          <form id="activity-signup-form">
            <div class="form-group">
              <label for="email">Student Email:</label>
              <input type="email" id="email" required placeholder="your-email@mergington.edu" />
            </div>
            <div class="form-group">
              <label for="activity">Select Activity:</label>
              <select id="activity" required>
                <option value="">-- Select an activity --</option>
              </select>
            </div>
            <button type="submit">Sign Up</button>
          </form>
          <div id="message" class="message hidden"></div>
        </div>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Mergington High School</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
